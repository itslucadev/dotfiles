add_newline = false
command_timeout = 1000
palette = "catppuccin_mocha"

format = """$directory$character"""
right_format = """$all"""

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"

[directory]
style = "bold maroon"
format = "[$path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Developer" = "Developer"
"com~apple~CloudDocs" = "iCloud"

[git_branch]
symbol = ""
style = "bold peach"
format = "[$symbol$branch(:$remote_branch) ]($style)"

[git_status]
style = "bold peach"
format = "[$all_status$ahead_behind ]($style)"

[nodejs]
symbol = ""
style = "bold sapphire"
format = "[$symbol($version) ]($style)"

[java]
style = "bold sapphire"
format = "[$symbol($version) ]($style)"

[mise]
disabled = false
style = "bold lavender"
format = "[$symbol$health]($style) "

[time]
disabled = false
time_format = "%R"
style = "bold blue"
format = "[♥ $time ]($style)"

