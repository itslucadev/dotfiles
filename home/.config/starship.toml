add_newline = false
command_timeout = 1000
palette = "rose_pine_moon"

format = """$directory$character"""
right_format = """$all"""

[character]
success_symbol = "[➜](bold foam)"
error_symbol = "[➜](bold love)"

[directory]
style = "bold love"
format = "[$path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Developer" = "Developer"
"com~apple~CloudDocs" = "iCloud"

[git_branch]
symbol = ""
style = "bold rose"
format = "[$symbol$branch(:$remote_branch) ]($style)"

[git_status]
style = "bold rose"
format = "[$all_status$ahead_behind ]($style)"

[nodejs]
symbol = ""
style = "bold foam"
format = "[$symbol($version) ]($style)"

[java]
style = "bold foam"
format = "[$symbol($version) ]($style)"

[mise]
disabled = false
style = "bold iris"
format = "[$symbol$health]($style) "

[time]
disabled = false
time_format = "%R"
style = "bold pine"
format = "[♥ $time ]($style)"

[palettes.rose_pine_moon]
base = "#232136"
surface = "#2a273f"
overlay = "#393552"
muted = "#6e6a86"
subtle = "#908caa"
text = "#e0def4"
love = "#eb6f92"
gold = "#f6c177"
rose = "#ea9a97"
pine = "#3e8fb0"
foam = "#9ccfd8"
iris = "#c4a7e7"
highlight_low = "#2a283e"
highlight_med = "#44415a"
highlight_high = "#56526e"
