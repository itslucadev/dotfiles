min_version = "2026.7.17"

[settings]
lockfile = true
lockfile_platforms = ["macos-arm64"]
minimum_release_age = "7d"
dotfiles.root = "~/github/phoenix-error/dotfiles/home"
dotfiles.default_mode = "symlink"

[settings.npm]
package_manager = "bun"

[tools]
bun = "latest"
java = "zulu-17"
node = "lts"
python = "3.12"
ruff = "latest"
uv = "latest"
"npm:@biomejs/biome" = "latest"
"npm:@posthog/cli" = "latest"
"npm:@swmansion/argent" = "latest"
"npm:@tobilu/qmd" = "latest"
"npm:agent-device" = "latest"
"npm:chrome-devtools-axi" = "latest"
"npm:ctx7" = "latest"
"npm:eas-cli" = "latest"
"npm:gh-axi" = "latest"
"npm:lavish-axi" = "latest"
"npm:prettier" = "latest"
"npm:pyright" = "latest"
"npm:react-doctor" = "latest"
"npm:turbo" = "latest"
"npm:typescript" = "latest"
"npm:typescript-language-server" = "latest"
"npm:vercel" = "latest"
"pipx:notebooklm-mcp-cli" = "latest"

[env]
ANDROID_HOME = "{{ env.HOME }}/Library/Android/sdk"
UV_PYTHON = { value = "{{ tools.python.path }}", tools = true }
_.path = [
  "{{ env.HOME }}/Library/Android/sdk/emulator",
  "{{ env.HOME }}/Library/Android/sdk/platform-tools",
]

[dotfiles]
"~/.agents.md" = { source = "home/AGENTS.md" }
"~/.claude/CLAUDE.md" = { source = "home/AGENTS.md" }
"~/.claude/rules/context7.md" = {}
"~/.claude/settings.json" = {}
"~/.claude/statusline.ts" = {}
"~/.config/ghostty" = {}
"~/.config/herdr/config.toml" = {}
"~/.homebrew/Brewfile" = { source = "Brewfile" }
"~/.config/mise/config.toml" = "~/github/phoenix-error/dotfiles/mise.toml"
"~/.config/starship.toml" = {}
"~/.config/wezterm/wezterm.lua" = {}
"~/Library/Application Support/Code/User/settings.json" = { source = "home/.config/editors/settings.json" }
"~/Library/Application Support/Cursor/User/settings.json" = { source = "home/.config/editors/settings.json" }
"~/.zprofile" = {}
"~/.zsh_plugins.txt" = {}
"~/.zshrc" = {}

[bootstrap.macos.dock]
autohide = true
orientation = "left"
tilesize = 36
show_recents = false

[bootstrap.macos.finder]
show_pathbar = true
show_status_bar = true
show_extensions_warning = false
preferred_view_style = "list"

[bootstrap.macos.keyboard]
key_repeat = 2
initial_key_repeat = 15
press_and_hold = false

[bootstrap.macos.trackpad]
tap_to_click = true

[bootstrap.macos.defaults]
NSGlobalDomain = { AppleInterfaceStyle = "Dark", AppleShowAllExtensions = true, _HIHideMenuBar = true }
"com.apple.HIToolbox" = { AppleFnUsageType = 0 }
"com.apple.desktopservices" = { DSDontWriteNetworkStores = true, DSDontWriteUSBStores = true }
"com.apple.finder" = { AppleShowAllExtensions = true, CreateDesktop = false }
"com.apple.screencapture" = { "disable-shadow" = true }

# `mise bootstrap` owns the stage order of the managed setup. It converges its
# own phases, dotfiles, macOS defaults, and tools, and these hooks add the
# stages it cannot express. Hooks halt the bootstrap when they fail, and
# `mise bootstrap --dry-run` prints them instead of running them.
#
# Homebrew and the manual Git gate run before the dotfiles phase, so Git,
# Homebrew casks, and every native CLI exist before anything depends on them.
[bootstrap.hooks.pre-dotfiles]
run = [
  "~/github/phoenix-error/dotfiles/scripts/install-homebrew-packages.sh",
  "~/github/phoenix-error/dotfiles/scripts/require-git-and-github.sh",
]

[bootstrap.hooks.pre-defaults]
run = "mkdir -p ~/Developer/appzudio"

# The runtimes install before the tools phase because other backends depend on
# them. The pipx backend needs uv, and every npm-backed tool needs bun as its
# package manager.
[bootstrap.hooks.pre-tools]
run = "mise install uv bun node python java ruff"

# Everything that needs the fully installed machine. The coding agent gate runs
# before the Herdr integrations, because Herdr can only hook an agent that has
# been started and signed in once. The doctor reports and never fails the setup.
[bootstrap.hooks.final]
run = [
  "~/github/phoenix-error/dotfiles/scripts/require-coding-agents.sh",
  "~/github/phoenix-error/dotfiles/scripts/install-herdr-integrations.sh",
  "~/github/phoenix-error/dotfiles/scripts/install-mas-apps.sh",
  "mise exec -- ~/github/phoenix-error/dotfiles/scripts/doctor.sh || true",
]

[tasks.setup]
description = "Apply the managed setup, from Homebrew through the setup doctor"
run = [
  "mise self-update --yes",
  "mise bootstrap --yes",
]

# Every task below runs a repository file, and this file is also the global mise
# configuration through the ~/.config/mise/config.toml symlink. mise derives a
# task's working directory from the configuration root, which is the home
# directory for a global configuration, so each of these declares the repository
# as its directory instead of relying on the caller's shell.
[tasks."update:mise-installer"]
description = "Refresh the committed mise installer from https://mise.run"
dir = "{{ env.HOME }}/github/phoenix-error/dotfiles"
run = [
  "curl -fsSL https://mise.run -o scripts/setup-mise.sh",
  "chmod +x scripts/setup-mise.sh",
]

[tasks."apps:mas"]
description = "Install the managed Mac App Store applications"
dir = "{{ env.HOME }}/github/phoenix-error/dotfiles"
run = "./scripts/install-mas-apps.sh"

[tasks."agents:login"]
description = "Wait until Claude Code, Codex, Cursor CLI, Oh My Pi, and Pi are signed in"
dir = "{{ env.HOME }}/github/phoenix-error/dotfiles"
run = "./scripts/require-coding-agents.sh"

[tasks."agents:herdr"]
description = "Install the Herdr agent integrations for Claude Code, Codex, Cursor, Oh My Pi, and Pi"
dir = "{{ env.HOME }}/github/phoenix-error/dotfiles"
run = "./scripts/install-herdr-integrations.sh"

[tasks.doctor]
description = "Report setup status and remaining manual actions"
dir = "{{ env.HOME }}/github/phoenix-error/dotfiles"
run = "./scripts/doctor.sh"
