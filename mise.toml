min_version = "2026.7.17"

[settings]
lockfile = true
lockfile_platforms = ["macos-arm64"]
minimum_release_age = "1d"
dotfiles.root = "~/github/phoenix-error/dotfiles/home"
dotfiles.default_mode = "symlink"

[settings.npm]
package_manager = "bun"

[tools]
bun = "latest"
doppler = "latest"
fnox = "latest"
# zulu-17 stays the active development version. zulu-jre-21 is the native arm64
# runtime for Minecraft and CurseForge, linked into
# ~/Library/Java/JavaVirtualMachines/zulu-jre-21.jre
java = ["zulu-17", "zulu-jre-21"]
node = "lts"
# The aqua backend installs the standalone pnpm binary, so pnpm sits next to the
# npm that ships with Node.js and Bun instead of being installed through either.
pnpm = "latest"
python = "3.12"
ruff = "latest"
uv = "latest"
"npm:@biomejs/biome" = "latest"
"npm:@swmansion/argent" = "latest"
"npm:@tobilu/qmd" = "latest"
"npm:agent-device" = "latest"
"npm:chrome-devtools-axi" = "latest"
"npm:ctx7" = "latest"
"npm:eas-cli" = "latest"
"npm:gh-axi" = "latest"
"npm:lavish-axi" = "latest"
"npm:prettier" = "latest"
"npm:pyright" = "latest"
"npm:react-doctor" = "latest"
"npm:turbo" = "latest"
"npm:typescript" = "latest"
"npm:typescript-language-server" = "latest"
"npm:vercel" = "latest"
"pipx:notebooklm-mcp-cli" = "latest"
"pipx:pdfminer.six" = "latest"

[env]
ANDROID_HOME = "{{ env.HOME }}/Library/Android/sdk"
# The Doppler CLI is installed and updated through mise, so its built-in
# self-updater must stay off. It also fails on this machine, because the
# signature verification needs a gnupg that Homebrew does not install.
DOPPLER_ENABLE_VERSION_CHECK = "false"
UV_PYTHON = { value = "{{ tools.python.path }}", tools = true }
_.path = [
  "{{ env.HOME }}/Library/Android/sdk/emulator",
  "{{ env.HOME }}/Library/Android/sdk/platform-tools",
]

# An entry without a source mirrors its home-relative target under
# `dotfiles.root`, which is absolute above. An explicit source has to be
# absolute too: mise resolves a relative one against the directory of the
# configuration file that declares the entry, and this file is declared through
# the ~/.config/mise/config.toml symlink, which mise does not follow. A relative
# source would therefore be looked up under ~/.config/mise instead of the
# repository.
[dotfiles]
# `home/AGENTS.md` is linked to the canonical `~/.agents/AGENTS.md` path and
# the four paths the managed agents actually read: Claude Code takes
# `~/.claude/CLAUDE.md`, Codex takes `$CODEX_HOME/AGENTS.md`, Oh My Pi takes
# `~/.omp/agent/AGENTS.md`, and OpenCode takes `~/.config/opencode/AGENTS.md`.
# The Cursor CLI has no home-level instruction file at all, only project ones.
"~/.agents/AGENTS.md" = { source = "~/github/phoenix-error/dotfiles/home/AGENTS.md" }
"~/.claude/CLAUDE.md" = { source = "~/github/phoenix-error/dotfiles/home/AGENTS.md" }
"~/.claude/rules/context7.md" = {}
"~/.claude/settings.json" = {}
"~/.claude/statusline.ts" = {}
"~/.codex/AGENTS.md" = { source = "~/github/phoenix-error/dotfiles/home/AGENTS.md" }
"~/.config/ghostty" = {}
"~/.config/herdr/config.toml" = {}
"~/.homebrew/Brewfile" = { source = "~/github/phoenix-error/dotfiles/Brewfile" }
# Empty on purpose. `/usr/bin/login` only checks that this file exists, and its
# presence silences the "Last login" banner in every login shell.
"~/.hushlogin" = {}
# `home/.zshrc` already puts `~/.local/bin` on PATH for mise, so a command
# linked here needs no alias and is reachable from every shell.
"~/.local/bin/keykey" = {}
"~/.omp/agent/AGENTS.md" = { source = "~/github/phoenix-error/dotfiles/home/AGENTS.md" }
"~/.config/opencode/AGENTS.md" = { source = "~/github/phoenix-error/dotfiles/home/AGENTS.md" }
"~/.config/mise/config.toml" = "~/github/phoenix-error/dotfiles/mise.toml"
"~/.config/starship.toml" = {}
"~/.config/wezterm/wezterm.lua" = {}
"~/Library/Application Support/Code/User/settings.json" = { source = "~/github/phoenix-error/dotfiles/home/.config/editors/settings.json" }
"~/Library/Application Support/Cursor/User/settings.json" = { source = "~/github/phoenix-error/dotfiles/home/.config/editors/settings.json" }
"~/.zprofile" = {}
"~/.zsh_plugins.txt" = {}
"~/.zshrc" = {}

[bootstrap.macos.dock]
autohide = true
orientation = "bottom"
tilesize = 64
show_recents = false

[bootstrap.macos.finder]
show_all_files = true
show_pathbar = true
show_status_bar = true
show_extensions_warning = false
preferred_view_style = "list"

[bootstrap.macos.keyboard]
key_repeat = 2
initial_key_repeat = 15
press_and_hold = false

[bootstrap.macos.trackpad]
tap_to_click = true

[bootstrap.macos.defaults]
# Appearance follows the light/dark schedule. `AppleInterfaceStyle` stays
# unmanaged on purpose, because macOS itself writes and deletes that key every
# time the schedule flips, and declaring it would fight the automatic switch.
NSGlobalDomain = { AppleInterfaceStyleSwitchesAutomatically = true, AppleShowAllExtensions = true, _HIHideMenuBar = true }
"com.apple.HIToolbox" = { AppleFnUsageType = 0 }
"com.apple.desktopservices" = { DSDontWriteNetworkStores = true, DSDontWriteUSBStores = true }
# Finder reads `AppleShowAllExtensions` from `NSGlobalDomain`, so it is only set there.
"com.apple.finder" = { CreateDesktop = false }
"com.apple.screencapture" = { "disable-shadow" = true }
# Sparkle-based applications check for updates but ask before installing by
# default, which is exactly the update banner this setup avoids. These two keys
# make every managed Sparkle cask download and install its updates silently.
# Homebrew leaves these casks alone because they are marked auto_updates, so
# the apps' own updaters are the only channel that keeps them current.
# ChatGPT really does ship with the com.openai.codex bundle identifier.
"ch.protonvpn.mac" = { SUEnableAutomaticChecks = true, SUAutomaticallyUpdate = true }
"com.colliderli.iina" = { SUEnableAutomaticChecks = true, SUAutomaticallyUpdate = true }
"com.fournova.Tower3" = { SUEnableAutomaticChecks = true, SUAutomaticallyUpdate = true }
# AltTab owns SUAutomaticallyUpdate through its own update-policy preference
# and rewrites the key while running, so declaring it would fight the app the
# same way AppleInterfaceStyle would fight the appearance schedule. Silent
# installs for AltTab are enabled in its preferences under Policies instead.
"com.lwouis.alt-tab-macos" = { SUEnableAutomaticChecks = true }
"com.mitchellh.ghostty" = { SUEnableAutomaticChecks = true, SUAutomaticallyUpdate = true }
"com.openai.codex" = { SUEnableAutomaticChecks = true, SUAutomaticallyUpdate = true }
"com.robinebers.openusage" = { SUEnableAutomaticChecks = true, SUAutomaticallyUpdate = true }
"com.xykong.Markdown" = { SUEnableAutomaticChecks = true, SUAutomaticallyUpdate = true }
"company.thebrowser.dia" = { SUEnableAutomaticChecks = true, SUAutomaticallyUpdate = true }
"dev.expo.orbit" = { SUEnableAutomaticChecks = true, SUAutomaticallyUpdate = true }
"io.tailscale.ipn.macsys" = { SUEnableAutomaticChecks = true, SUAutomaticallyUpdate = true }
"net.pornel.ImageOptim" = { SUEnableAutomaticChecks = true, SUAutomaticallyUpdate = true }
"pl.maketheweb.cleanshotx" = { SUEnableAutomaticChecks = true, SUAutomaticallyUpdate = true }
# The Mac App Store applications from Brewfile.mas update themselves only when
# the App Store's automatic updates are on, which is a per-machine choice that
# this key pins.
"com.apple.commerce" = { AutoUpdate = true }

# `mise bootstrap` owns the stage order of the managed setup. It converges its
# own phases, dotfiles, macOS defaults, and tools, and these hooks add the
# stages it cannot express. Hooks halt the bootstrap when they fail, and
# `mise bootstrap --dry-run` prints them instead of running them.
#
# Homebrew and the manual Git gate run before the dotfiles phase, so Git,
# Homebrew casks, and every native CLI exist before anything depends on them.
[bootstrap.hooks.pre-dotfiles]
run = [
  "~/github/phoenix-error/dotfiles/scripts/install-homebrew-packages.sh",
  "~/github/phoenix-error/dotfiles/scripts/require-git-and-github.sh",
  "~/github/phoenix-error/dotfiles/scripts/resolve-dotfile-conflicts.sh",
]

[bootstrap.hooks.pre-defaults]
run = "mkdir -p ~/Developer/appzudio"

# The runtimes install before the tools phase because other backends depend on
# them. The pipx backend needs uv, and every npm-backed tool needs bun as its
# package manager.
[bootstrap.hooks.pre-tools]
run = "mise install uv bun node python java ruff"

# Everything that needs the fully installed machine. The coding agent gate runs
# before the Herdr integrations, because Herdr can only hook an agent that has
# been started and signed in once. The doctor reports and never fails the setup.
[bootstrap.hooks.final]
run = [
  "~/github/phoenix-error/dotfiles/scripts/require-coding-agents.sh",
  "~/github/phoenix-error/dotfiles/scripts/install-herdr-integrations.sh",
  "~/github/phoenix-error/dotfiles/scripts/install-mas-apps.sh",
  "~/github/phoenix-error/dotfiles/scripts/setup-autoupdate.sh",
  "mise exec -- ~/github/phoenix-error/dotfiles/scripts/doctor.sh || true",
]

[tasks.setup]
description = "Apply the managed setup, from Homebrew through the setup doctor"
run = [
  "mise self-update --yes",
  "mise bootstrap --yes",
]

# Every task below runs a repository file, and this file is also the global mise
# configuration through the ~/.config/mise/config.toml symlink. mise derives a
# task's working directory from the configuration root, which is the home
# directory for a global configuration, so each of these declares the repository
# as its directory instead of relying on the caller's shell.
[tasks."update:mise-installer"]
description = "Refresh the committed mise installer from https://mise.run"
dir = "{{ env.HOME }}/github/phoenix-error/dotfiles"
run = [
  "curl -fsSL https://mise.run -o scripts/setup-mise.sh",
  "chmod +x scripts/setup-mise.sh",
]

[tasks."apps:mas"]
description = "Install the managed Mac App Store applications"
dir = "{{ env.HOME }}/github/phoenix-error/dotfiles"
run = "./scripts/install-mas-apps.sh"

[tasks."agents:login"]
description = "Wait until Claude Code, Codex, Cursor CLI, Oh My Pi, and Pi are signed in"
dir = "{{ env.HOME }}/github/phoenix-error/dotfiles"
run = "./scripts/require-coding-agents.sh"

[tasks."agents:herdr"]
description = "Install the Herdr agent integrations for Claude Code, Codex, Cursor, Oh My Pi, and Pi"
dir = "{{ env.HOME }}/github/phoenix-error/dotfiles"
run = "./scripts/install-herdr-integrations.sh"

[tasks."update:tools"]
description = "Upgrade Homebrew, Mac App Store applications, mise, and mise tools now"
dir = "{{ env.HOME }}/github/phoenix-error/dotfiles"
run = "./scripts/update-tools.sh"

[tasks."update:schedule"]
description = "Install the launchd agent that runs update:tools daily at 07:00"
dir = "{{ env.HOME }}/github/phoenix-error/dotfiles"
run = "./scripts/setup-autoupdate.sh"

[tasks.doctor]
description = "Report setup status and remaining manual actions"
dir = "{{ env.HOME }}/github/phoenix-error/dotfiles"
run = "./scripts/doctor.sh"
